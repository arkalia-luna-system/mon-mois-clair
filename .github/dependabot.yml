# Mises à jour automatiques (PRs) — ne bloque pas le push.
# Phase 3 soft : Actions + Gradle (PRs hebdo, pas de garde CI).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - gradle
