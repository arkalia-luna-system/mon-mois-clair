# Mises à jour automatiques (PRs) — ne bloque pas le push.
# Phase 3 soft : Actions + Gradle (PRs hebdo, pas de garde CI).
# Security Updates GitHub (jobs « gradle in /. for … ») ≠ ce fichier :
# un ignore ici n’éteint pas ces runs (voir docs/CI.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Guava / jars AGP = transitifs : laisser Dependabot les voir en version updates.
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    # #54 : Kotlin ≥2.4 exige AGP 9 — pin documenté 2.0.21 (docs/CI.md).
    ignore:
      - dependency-name: "org.jetbrains.kotlin.android"
        versions: [">=2.1.0"]
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        versions: [">=2.1.0"]
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
        versions: [">=2.1.0"]
      - dependency-name: "com.google.devtools.ksp"
        versions: [">=2.1.0"]
      # Coroutines 1.10+ = kotlin-stdlib ≥2.1 ; 1.11 = 2.2 — casse pin Kotlin 2.0.21.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-android"
        versions: [">=1.10.0"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-test"
        versions: [">=1.10.0"]
      # Hilt ≥2.58 (PR #39) casse KSP sur pin Kotlin 2.0.21 ; ≥2.59 exige AGP 9 — rester 2.52.
      - dependency-name: "hiltVersion"
        versions: [">=2.58.0"]
      - dependency-name: "com.google.dagger.hilt.android"
        versions: [">=2.58.0"]
      - dependency-name: "com.google.dagger:hilt-android"
        versions: [">=2.58.0"]
      - dependency-name: "com.google.dagger:hilt-compiler"
        versions: [">=2.58.0"]
      # Netty 4.2.x : bumps Dependabot module par module ≠ forceNetty 4.1.x (PR #33/#34 fermées).
      - dependency-name: "io.netty:netty-handler-proxy"
        versions: [">=4.2.0"]
      - dependency-name: "io.netty:netty-codec-socks"
        versions: [">=4.2.0"]
      - dependency-name: "com.android.application"
        versions: [">=9.0.0"]
      - dependency-name: "com.android.library"
        versions: [">=9.0.0"]
      # Wrapper 9.x = chantier AGP 9 ; PR #36 a pu passer les tests mais merge non safe.
      - dependency-name: "gradle-wrapper"
        versions: [">=9.0.0"]
      # sqlcipher 4.20+ tire kotlin-stdlib ≥2.2 (KSP pin 2.0.21) — PR #38 CI rouge légitime.
      - dependency-name: "net.zetetic:sqlcipher-android"
        versions: [">=4.7.0"]
    labels:
      - dependencies
      - gradle
