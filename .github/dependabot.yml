# Mises à jour automatiques (PRs) — ne bloque pas le push.
# Phase 3 soft : Actions + Gradle (PRs hebdo, pas de garde CI).
# Security Updates GitHub (jobs « gradle in /. for … ») ≠ ce fichier :
# un ignore ici n’éteint pas ces runs (voir docs/CI.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Guava / jars AGP = transitifs : laisser Dependabot les voir en version updates.
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    # #54 : Kotlin ≥2.4 exige AGP 9 — pin documenté 2.0.21 (docs/CI.md).
    ignore:
      - dependency-name: "org.jetbrains.kotlin.android"
        versions: [">=2.1.0"]
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        versions: [">=2.1.0"]
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
        versions: [">=2.1.0"]
      - dependency-name: "com.google.devtools.ksp"
        versions: [">=2.1.0"]
      # Coroutines 1.10+ = kotlin-stdlib ≥2.1 ; 1.11 = 2.2 — casse pin Kotlin 2.0.21.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-android"
        versions: [">=1.10.0"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-test"
        versions: [">=1.10.0"]
    labels:
      - dependencies
      - gradle
