# CI — phase 1 + phase 2 soft (lint non bloquant)
# Objectif : compile + tests unitaires (bloquant) ; lintDebug en rapport (continue-on-error).
# Pas encore : lint bloquant, detekt, scan CVE bloquant (voir docs/CI.md).

name: CI

on:
  push:
    # develop = travail quotidien ; main = stable (merge explicite seulement).
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Assemble debug + tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    env:
      # Pas de daemon en CI (runner éphémère).
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Ne pas installer le package obsolète "tools" (casse sdkmanager depuis 2025+).
      # v4 = runtime Node 24 (évite le warning GitHub « Node.js 20 deprecated »).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug + unit tests
        # Même commande locale que la charte / PROGRESS_LOG (sans --rerun-tasks en CI :
        # le runner est propre à chaque job).
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace --no-daemon

      # Phase 2 soft : rapport Lint sans faire échouer le job (on durcit plus tard).
      - name: Lint debug (non bloquant)
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-and-lint-reports
          # settings.gradle.kts redirige build/ vers ~/.cache/mon-mois-clair/gradle-build/
          path: |
            /home/runner/.cache/mon-mois-clair/gradle-build/app/reports/tests/
            /home/runner/.cache/mon-mois-clair/gradle-build/app/test-results/
            /home/runner/.cache/mon-mois-clair/gradle-build/app/reports/lint-results-debug.html
            /home/runner/.cache/mon-mois-clair/gradle-build/app/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
