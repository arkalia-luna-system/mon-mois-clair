# CI — phase 1 + phase 2 soft (lint non bloquant)
# Objectif : tests unitaires (bloquant) ; lintDebug en rapport (continue-on-error).
# Pas encore : lint bloquant, detekt, scan CVE bloquant (voir docs/CI.md).

name: CI

on:
  push:
    # develop = travail quotidien ; main = stable (merge explicite seulement).
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Pas de concurrency : chaque push va au bout.
# cancel-in-progress (true ou false) produisait des runs « cancelled »
# (« Canceling since a higher priority waiting request… ») affichés
# comme « 1 erreur » alors que les tests n’avaient pas échoué.
# Sur ce dépôt familial, des runs parallèles courts sont acceptables.

jobs:
  build-and-test:
    name: Tests unitaires (+ lint soft)
    # Pin explicite : évite l’avis de migration ubuntu-latest → 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    env:
      # Pas de daemon en CI (runner éphémère).
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.vfs.watch=false
        -Dkotlin.compiler.execution.strategy=in-process
      # Accélère sans changer gradle.properties local (T7).
      ORG_GRADLE_PROJECT_org.gradle.caching: "true"
      ORG_GRADLE_PROJECT_org.gradle.parallel: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # Le cache dépendances/build est géré par gradle/actions/setup-gradle.

      # Cache ~/.gradle + build-cache (gros gain dès le 2ᵉ run).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      # Ne pas installer le package obsolète "tools" (casse sdkmanager depuis 2025+).
      # v4 = runtime Node 24 (évite le warning GitHub « Node.js 20 deprecated »).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Pas d’assembleDebug ici : packaging APK (dex/strip/so) = minutes pour peu
      # de signal. testDebugUnitTest compile déjà debug + ressources + exécute les tests.
      # assembleDebug reste la commande locale / release (charte, PROGRESS_LOG).
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      # Phase 2 soft : rapport Lint sans faire échouer le job (on durcit plus tard).
      # 2ᵉ invoc Gradle : build-cache chaud → nettement plus court que le 1er run.
      - name: Lint debug (non bloquant)
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-and-lint-reports
          # settings.gradle.kts redirige build/ vers ~/.cache/mon-mois-clair/gradle-build/
          path: |
            /home/runner/.cache/mon-mois-clair/gradle-build/app/reports/tests/
            /home/runner/.cache/mon-mois-clair/gradle-build/app/test-results/
            /home/runner/.cache/mon-mois-clair/gradle-build/app/reports/lint-results-debug.html
            /home/runner/.cache/mon-mois-clair/gradle-build/app/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
